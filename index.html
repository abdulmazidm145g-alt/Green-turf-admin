<!DOCTYPE html><html lang="bn" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Green Turf Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07110b;--sf:#0e1c13;--sf2:#14271a;--ln:#1f3526;--tx:#eef6ef;--mu:#8fa596;--g:#b6f23a;--g2:#2f9e4f;--ink:#06160a;--rd:#ef4444;--am:#f59e0b;color-scheme:dark}{
[data-theme=light]{--bg:#f2f7f2;--sf:#fff;--sf2:#e6efe7;--ln:#d3e1d6;--tx:#0b2012;--mu:#546b5b;--g:#2f9e4f;--g2:#1f7a39;--ink:#fff;color-scheme:light}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth;overflow-x:hidden}
body{background:var(--bg);color:var(--tx);font:400 15px/1.55 'Hind Siliguri',system-ui,sans-serif;min-height:100vh;overflow-x:clip;transition:background .3s,color .3s}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
input,select,textarea{width:100%;background:var(--sf2);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;outline:0;transition:border-color .2s}input:focus,select:focus,textarea:focus{border-color:var(--g)}
label{display:block;color:var(--mu);font-size:12.5px;margin:10px 0 4px}
.btn{display:inline-flex;gap:6px;align-items:center;justify-content:center;background:var(--g);color:var(--ink);font-weight:700;padding:10px 18px;border-radius:12px;transition:transform .15s,filter .2s}.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.96)}
.btn.o{background:none;color:var(--tx);border:1px solid var(--ln)}.btn.r{background:var(--rd);color:#fff}.btn.s{padding:6px 12px;font-size:13px;border-radius:10px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:16px;margin-bottom:14px;animation:up .45s both}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
h2{font-size:21px;margin-bottom:12px}h3{font-size:16px;margin-bottom:8px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:14px;cursor:pointer;transition:transform .2s,border-color .2s;animation:up .45s both}.stat:hover{transform:translateY(-3px);border-color:var(--g)}
.stat small{color:var(--mu)}.stat b{display:block;font:700 24px Oswald}
.in{color:var(--g)}.out{color:var(--rd)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}.row small,.mu{color:var(--mu)}
.tag{font-size:11px;padding:2px 9px;border-radius:99px;border:1px solid var(--ln)}.tag.pending{color:var(--am);border-color:var(--am)}.tag.approved,.tag.paid,.tag.free{color:var(--g);border-color:var(--g)}.tag.rejected,.tag.busy,.tag.closed{color:var(--rd);border-color:var(--rd)}
.hrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.sl{border:1px solid var(--ln);background:var(--sf2);border-radius:12px;padding:8px;text-align:center;transition:transform .15s}.sl:active{transform:scale(.95)}
.sl small{display:block;color:var(--mu)}.sl.b{border-color:var(--g);background:color-mix(in srgb,var(--g) 14%,var(--sf2))}.sl.x{border-color:var(--rd);background:color-mix(in srgb,var(--rd) 14%,var(--sf2))}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px;scrollbar-width:none}.tabs button{padding:7px 14px;border-radius:99px;border:1px solid var(--ln);color:var(--mu);white-space:nowrap;transition:.2s}.tabs button.on{background:var(--g);color:var(--ink);border-color:var(--g)}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:8px}.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:9px;color:var(--mu)}.bars i{width:100%;background:linear-gradient(var(--g),var(--g2));border-radius:5px 5px 0 0;min-height:2px;transform-origin:bottom;animation:gr .7s both}@keyframes gr{from{transform:scaleY(0)}}
header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;height:64px;padding:env(safe-area-inset-top,0) 14px 0;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--ln)}
header b{font:700 20px Oswald;letter-spacing:.04em;flex:1;text-transform:uppercase}header b span{color:var(--g)}
.ib{width:42px;height:42px;border-radius:50%;border:1px solid var(--ln);background:var(--sf);display:grid;place-items:center;transition:border-color .2s}.ib:hover{border-color:var(--g)}
main{padding:16px 14px 130px;max-width:1000px;margin:auto}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bot{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;justify-content:space-around;background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.03) 50%,rgba(255,255,255,.1));backdrop-filter:blur(10px) saturate(210%) brightness(1.1);-webkit-backdrop-filter:blur(10px) saturate(210%) brightness(1.1);border:1px solid rgba(255,255,255,.22);border-radius:28px;padding:9px 4px;box-shadow:0 12px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.35)}
[data-theme=light] .bot{background:linear-gradient(160deg,rgba(255,255,255,.7),rgba(255,255,255,.3));border-color:#fff}
.nv{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--mu);padding:5px 10px;border-radius:16px;min-width:56px;transition:transform .2s,color .3s}
.nv:after{content:"";position:absolute;bottom:-3px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--g);transform:scale(0);transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.nv.on{color:var(--g);font-weight:600}.nv.on:after{transform:scale(1)}.nv.on svg{filter:drop-shadow(0 0 5px color-mix(in srgb,var(--g) 60%,transparent));transform:translateY(-3px) scale(1.12)}.nv svg{transition:transform .35s cubic-bezier(.34,1.56,.64,1)}.nv:active{transform:scale(.88)}
.side{position:fixed;inset:0;z-index:60;visibility:hidden;transition:visibility .35s}.side.on{visibility:visible}.side i{position:absolute;inset:0;background:#0009;opacity:0;transition:.3s}.side.on i{opacity:1}
.side nav{position:absolute;top:0;bottom:0;right:0;width:78%;max-width:300px;background:var(--sf);border-left:1px solid var(--ln);padding:20px 12px;transform:translateX(100%);transition:transform .35s cubic-bezier(.3,.9,.3,1);display:flex;flex-direction:column;gap:2px}.side.on nav{transform:none}
.side .nv,.dsk .nv{flex-direction:row;gap:12px;font-size:15px;padding:11px 12px;border-radius:12px;width:100%;min-width:0}.side .nv:after,.dsk .nv:after{display:none}.side .nv.on,.dsk .nv.on{background:var(--sf2)}.side .nv.on svg,.dsk .nv.on svg{transform:none}
.dsk{display:none}.seg{display:flex;gap:6px}.seg button{flex:1;padding:9px;border-radius:12px;border:1px solid var(--ln);color:var(--mu)}.seg button.on{background:var(--g);color:var(--ink);border-color:var(--g);font-weight:700}
.toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,30px);background:var(--g);color:var(--ink);padding:10px 18px;border-radius:12px;font-weight:600;opacity:0;transition:.3s;z-index:90;pointer-events:none}.toast.on{opacity:1;transform:translate(-50%,0)}
.prev{width:100%;height:130px;object-fit:cover;border-radius:12px;border:1px solid var(--ln);margin-top:6px;background:var(--sf2)}
#pp{position:fixed;inset:0;z-index:120;display:grid;place-items:center;background:#0008;opacity:0;visibility:hidden;transition:.25s}#pp.on{opacity:1;visibility:visible}.pb{background:var(--sf);border:1px solid var(--g);border-radius:22px;padding:26px 32px;text-align:center;max-width:300px;animation:pop .4s cubic-bezier(.34,1.56,.64,1)}.pb.bad{border-color:var(--rd)}.pb b{display:block;margin-top:10px}.pb small{color:var(--mu)}.pc{width:54px;height:54px;border-radius:50%;background:var(--g);color:var(--ink);font:700 28px/54px Oswald;margin:auto}.bad .pc{background:var(--rd);color:#fff}@keyframes pop{from{transform:scale(.6);opacity:0}}
#login{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:18px;overflow:auto;transition:opacity .55s,transform .55s}#login.out{opacity:0;transform:scale(1.05);pointer-events:none}
#login:before,#login:after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;filter:blur(90px);opacity:.28;animation:fl 9s ease-in-out infinite alternate;pointer-events:none}
#login:before{background:var(--g);top:-120px;left:-100px}#login:after{background:var(--g2);bottom:-140px;right:-100px;animation-delay:-4s}@keyframes fl{to{transform:translate(60px,40px) scale(1.15)}}
.lg{position:relative;z-index:1;display:grid;width:100%;max-width:410px;background:color-mix(in srgb,var(--sf) 88%,transparent);backdrop-filter:blur(18px);border:1px solid var(--ln);border-radius:28px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:pop .6s cubic-bezier(.34,1.4,.64,1)}
.lg.shake{animation:shk .5s}@keyframes shk{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.lgb{display:none;position:relative;flex-direction:column;justify-content:center;gap:18px;padding:44px;background:linear-gradient(150deg,var(--g2),#0b3d1c 70%);color:#fff;overflow:hidden}
.lgb:after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;border:48px solid #ffffff12;right:-90px;bottom:-90px}
.lgb img{width:74px;height:74px;object-fit:contain;filter:drop-shadow(0 6px 14px #0006)}.lgb h1{font:700 34px/1.05 Oswald;letter-spacing:.04em}.lgb h1 span{color:var(--g)}.lgb p{opacity:.8}
.lgb li{list-style:none;display:flex;gap:10px;align-items:center;padding:6px 0;animation:up .6s both}.lgb li:before{content:"✓";width:22px;height:22px;border-radius:50%;background:#ffffff26;display:grid;place-items:center;font-size:12px;flex:none}
.lgf{padding:34px 28px 30px}.lgf .mob{display:flex;align-items:center;gap:10px;margin-bottom:20px}.lgf .mob img{width:46px;height:46px;object-fit:contain}.lgf .mob b{font:700 20px Oswald;letter-spacing:.04em}.lgf .mob b span{color:var(--g)}
.lgf h2{margin-bottom:4px}.lgf .sub{color:var(--mu);margin-bottom:14px}
.fi{position:relative}.fi svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--mu);width:19px;height:19px;pointer-events:none}.fi input{padding:13px 44px 13px 42px;border-radius:14px}.fi .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;color:var(--mu);display:grid;place-items:center}
#lgerr{min-height:22px;color:var(--rd);font-size:13.5px;margin:10px 0 2px;animation:up .3s both}
.lgbtn{position:relative;width:100%;height:50px;border-radius:14px;background:linear-gradient(120deg,var(--g2),var(--g));color:var(--ink);font-weight:700;font-size:16px;overflow:hidden;transition:transform .15s,box-shadow .3s;box-shadow:0 8px 24px color-mix(in srgb,var(--g) 35%,transparent)}.lgbtn:active{transform:scale(.97)}.lgbtn:disabled{cursor:default}
.lgbtn .sp,.lgbtn .ck{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:.25s}.lgbtn .sp:after{content:"";width:22px;height:22px;border:3px solid #0003;border-top-color:var(--ink);border-radius:50%;animation:spn .7s linear infinite}@keyframes spn{to{transform:rotate(360deg)}}
.lgbtn.ld .lt{opacity:0}.lgbtn.ld .sp{opacity:1}.lgbtn.okk{background:var(--g2);color:#fff}.lgbtn.okk .lt,.lgbtn.okk .sp{opacity:0}.lgbtn.okk .ck{opacity:1;font:700 26px Oswald;animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
@media(min-width:900px){.lg{max-width:900px;grid-template-columns:1.05fr 1fr;min-height:560px}.lgb{display:flex}.lgf{display:flex;flex-direction:column;justify-content:center;padding:48px 44px}.lgf .mob{display:none}}
@media(min-width:900px){.bot,.ib.m{display:none}.dsk{display:flex;flex-direction:column;gap:3px;position:fixed;top:64px;bottom:0;left:0;width:240px;padding:16px 12px;border-right:1px solid var(--ln);background:var(--sf);overflow:auto}main{margin-left:240px;max-width:none;padding:26px 32px 40px}.toast{bottom:30px}}

/* ===== slot manager popup ===== */
#sm{position:fixed;inset:0;z-index:110;display:flex;align-items:flex-end;justify-content:center;background:#000b;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
#sm.on{opacity:1;visibility:visible}
.sm{width:100%;max-width:480px;max-height:92vh;overflow:auto;background:var(--sf);border:1px solid var(--ln);border-bottom:0;border-radius:26px 26px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(60px);transition:transform .35s cubic-bezier(.2,.9,.25,1.05);scrollbar-width:none}
.sm::-webkit-scrollbar{display:none}
#sm.on .sm{transform:none}
@media(min-width:700px){#sm{align-items:center}.sm{border-bottom:1px solid var(--ln);border-radius:26px;padding-top:18px}}
.smg{width:42px;height:4px;border-radius:9px;background:var(--ln);margin:0 auto 12px}@media(min-width:700px){.smg{display:none}}
.smh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.smh h3{margin:0;font-size:19px}.smh small{color:var(--mu);display:block;margin-top:2px}
.smx{width:34px;height:34px;border-radius:50%;background:var(--sf2);border:1px solid var(--ln);font-size:16px;line-height:1;flex:none}
.sml{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:12.5px;margin:14px 0 7px;font-weight:600;letter-spacing:.2px}
.sml i{font-style:normal;color:var(--g)}
.smhr{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.smhr button{position:relative;padding:7px 2px;border-radius:11px;border:1px solid var(--ln);background:var(--sf2);font-size:12.5px;transition:.18s}
.smhr button.on{background:var(--g);color:var(--ink);border-color:var(--g);font-weight:700}
.smhr button:before{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:transparent}
.smhr button.b:before{background:var(--g2)}.smhr button.x:before{background:var(--rd)}
.smhr button.on.b:before,.smhr button.on.x:before{background:var(--ink)}
.smc{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.smc button{display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:14px;border:1.5px solid var(--ln);background:var(--sf2);font-weight:600;text-align:left;transition:.2s}
.smc button span{width:10px;height:10px;border-radius:50%;background:var(--mu);flex:none}
.smc button.f span{background:var(--g)}.smc button.y span{background:var(--am)}.smc button.c span{background:var(--rd)}.smc button.o span{background:#38bdf8}
.smc button.on{border-color:var(--g);background:color-mix(in srgb,var(--g) 14%,var(--sf2))}
.smc button.on.c{border-color:var(--rd);background:color-mix(in srgb,var(--rd) 14%,var(--sf2))}
.smc button.on.y{border-color:var(--am);background:color-mix(in srgb,var(--am) 14%,var(--sf2))}
.smc button.on.o{border-color:#38bdf8;background:color-mix(in srgb,#38bdf8 14%,var(--sf2))}
.smp{display:flex;align-items:center;gap:8px}
.smp .pi{position:relative;flex:1}.smp .pi b{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--mu);font-weight:700}
.smp .pi input{padding-left:30px;font:700 18px Oswald,sans-serif;text-align:left}
.smp button{width:44px;height:44px;border-radius:12px;border:1px solid var(--ln);background:var(--sf2);font-size:18px;font-weight:700;flex:none}
.smp button:active{transform:scale(.92)}
.smr{display:flex;gap:6px;flex-wrap:wrap}
.smr button{padding:6px 12px;border-radius:99px;border:1px solid var(--ln);color:var(--mu);font-size:13px;transition:.2s}
.smr button.on{background:var(--g);color:var(--ink);border-color:var(--g);font-weight:700}
.smr button.rs.on{background:var(--am);border-color:var(--am)}
.smb{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--sf2);border:1px solid var(--ln);border-radius:14px;padding:10px 12px;margin-top:8px;font-size:13.5px}
.smb small{color:var(--mu);display:block}
.smf{display:flex;gap:10px;margin-top:18px}.smf .btn{flex:1;padding:13px}
.smn{color:var(--mu);font-size:12px;text-align:center;margin-top:10px}
.smn:before{content:"● ";color:var(--g)}

/* ===== support inbox ===== */
.sup{display:grid;grid-template-columns:300px 1fr;gap:12px;height:calc(100vh - 200px);min-height:420px}
.supl{overflow:auto;background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:6px}
.supc{display:block;width:100%;text-align:start;padding:10px 12px;border-radius:12px;position:relative;border:1px solid transparent}.supc:hover,.supc.on{background:var(--sf2)}.supc.on{border-color:var(--g)}
.supc b{display:block}.supc small{display:block;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.supc em{font-style:normal;font-size:11px;color:var(--mu)}.supc i{position:absolute;top:14px;inset-inline-end:12px;width:10px;height:10px;border-radius:50%;background:var(--g)}
.supm{display:flex;flex-direction:column;background:var(--sf);border:1px solid var(--ln);border-radius:18px;overflow:hidden;min-height:0}
.supt{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:5px;background:var(--bg)}
.sb{max-width:78%;padding:7px 11px;border-radius:12px;white-space:pre-wrap;word-break:break-word;font-size:14.5px}.sb small{display:block;font-size:10.5px;opacity:.65;text-align:end;margin-top:2px}
.sb.u{align-self:flex-start;background:var(--sf2);border-top-left-radius:3px}.sb.a{align-self:flex-end;background:var(--g);color:var(--ink);border-top-right-radius:3px}
.suph{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--ln)}.suph div{flex:1;min-width:0}.suph .bk{display:none}
.supf{display:flex;gap:8px;padding:10px;border-top:1px solid var(--ln);align-items:flex-end}.supf textarea{resize:none;max-height:110px}
@media(max-width:860px){.sup{grid-template-columns:1fr;height:calc(100vh - 230px)}.sup.has .supl{display:none}.sup:not(.has) .supm{display:none}.suph .bk{display:inline-flex}}

/* ===== support chat polish ===== */
.suph{background:var(--sf);padding:10px 14px}
.suph .sav{flex:none;width:40px;height:40px;border-radius:50%;background:var(--g);color:var(--ink);display:grid;place-items:center;font:700 18px Oswald,sans-serif}
.supt{background:var(--bg) radial-gradient(color-mix(in srgb,var(--ln) 70%,transparent) 1px,transparent 1.5px) 0 0/22px 22px;gap:6px;padding:14px 12px}
.sb{box-shadow:0 1px 2px rgba(0,0,0,.2);line-height:1.4}
.supc i.supb{width:auto;min-width:20px;height:20px;border-radius:10px;background:#ef4444;color:#fff;font:700 11px/20px sans-serif;text-align:center;padding:0 6px;top:12px}
.supc .tag{font-size:10px;padding:0 7px;vertical-align:middle}
.sb.u{border-top-left-radius:4px}.sb.a{border-top-right-radius:4px}
.supf{align-items:center;background:var(--sf);padding:10px 12px}
.supf textarea{border-radius:22px;padding:12px 16px;min-height:46px;line-height:1.3}
.supf .snd{flex:none;width:46px;height:46px;padding:0;border-radius:50%}
.supf .snd svg{width:22px;height:22px;fill:currentColor;stroke:none}

/* ===== advance system ===== */
.tag.adv{color:var(--g);border-color:var(--g)}.tag.hold{color:var(--am);border-color:var(--am)}.tag.cancelled,.tag.expired{color:var(--rd);border-color:var(--rd)}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--sf2);border:1px solid var(--ln);margin:6px 6px 0 0}.chip.in{color:var(--g)}.chip.dn{color:var(--am)}.chip.bd{color:var(--rd)}
.bka{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
#bm{position:fixed;inset:0;z-index:105;display:flex;align-items:flex-end;justify-content:center;background:#000b;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;visibility:hidden;transition:.25s}#bm.on{opacity:1;visibility:visible}

  if(net>0)h+=`<h4 class="bmt">${T('রিফান্ড','Refund')}</h4><div class="bmg2"><input id="bm_r" type="number" min="1" value="${net}"><button class="btn o" onclick="bmRef()">${T('রিফান্ড দিন','Refund')}</button></div>`;
  h+=`<h4 class="bmt">${T('বাতিল','Cancel')}</h4><div class="bmg2">${net>0?`<button class="btn r" onclick="bkCancel(${u},true)">${T('বাতিল + রিফান্ড','Cancel + refund')}</button><button class="btn o" onclick="bkCancel(${u},false)">${T('বাতিল (রিফান্ড ছাড়া)','Cancel, no refund')}</button>`:`<button class="btn r" onclick="bkCancel(${u},false)">${T('বুকিং বাতিল','Cancel booking')}</button>`}</div>`;
  if(isPend(b))h+=`<button class="btn r bmw" onclick="bkReject(${u})">${T('রিজেক্ট (পেমেন্ট ভুয়া/ভুল)','Reject (payment invalid)')}</button>`;
 }else if(b.status==='cancelled'){
  h+=`<h4 class="bmt">${T('রিফান্ড অবস্থা','Refund status')}</h4>`+r(T('পলিসি অনুযায়ী','By policy'),ci.amt?(ci.rf?T('রিফান্ডযোগ্য ৳','Refundable ৳')+ci.amt:T('রিফান্ড নেই (দেরিতে বাতিল)','Not refundable (late cancel)')):'—',ci.rf?'in':'out');
  if(ci.amt&&!ci.done){h+=`<div class="bmg2"><input id="bm_r" type="number" min="1" value="${ci.amt}"><button class="btn" onclick="bmRef()">${ci.rf?T('রিফান্ড দিলাম','Mark refunded'):T('তবুও রিফান্ড','Refund anyway')}</button></div>`;if(!ci.rf&&ci.net===0)h+=`<button class="btn o bmw" onclick="bkKeep(${u})">${T('টাকাটা আয় হিসেবে রাখুন ৳','Keep as income ৳')}${ci.amt}</button>`}
  else if(ci.done)h+=r(T('অবস্থা','Status'),ci.kept?T('আয় হিসেবে রাখা হয়েছে','Kept as income'):T('রিফান্ড দেওয়া হয়েছে','Refunded'),'in');
 }
 h+=`<button class="btn o bmw" style="margin-top:18px;color:var(--rd)" onclick="bkDelete(${u})">${T('রেকর্ড মুছুন','Delete record')}</button>`;
 el.innerHTML=h}
document.body.insertAdjacentHTML('beforeend','<div id="bm" onclick="if(event.target===this)bmClose()"><div class="bmc" id="bmc"></div></div>');
function sweep(){const n=Date.now();BK.forEach(b=>{if(b.status==='hold'&&b.hx&&b.hx<n&&!SWP.has(b.id)){SWP.add(b.id);const w=writeBatch(db);slotDel(w,b);w.update(bref(b),{status:'expired'});w.commit().catch(()=>SWP.delete(b.id))}})}
setInterval(()=>{if(auth.currentUser)sweep()},20000);
setInterval(()=>{if(R==='slot'&&!SM&&auth.currentUser)draw()},60000);
window.savePay=()=>ok(setDoc(doc(db,'config','payment'),Object.fromEntries(['bkash','nagad','upay','rocket'].map(k=>[k,$('#p_'+k).value.trim()])),{merge:true}));
window.draw=draw;window.$=$;Object.defineProperty(window,'FT',{get:()=>FT,set:v=>FT=v});Object.defineProperty(window,'SP',{get:()=>SP,set:v=>SP=v});Object.defineProperty(window,'DAY',{get:()=>DAY,set:v=>DAY=v});
applyTheme();nav();
</script></body></html>
